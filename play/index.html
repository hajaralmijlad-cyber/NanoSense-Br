<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050f2b">
<title>Dust Rush</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout concept: one phone-sized column. Start (build your robot + name) -> Game (full arena) -> Result (incident or win + Top 10). Single dark arcade look by choice. */
:root{
  --bg:#050f2b; --bg2:#04204f; --panel:#0a2a63; --ink:#e8f3ff; --mute:#9bb6e6;
  --cyan:#5fd4ff; --blue:#1b5cff; --amber:#f2c14e; --red:#ff6b6b; --line:#27439a;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:10px; box-sizing:border-box; overflow:hidden; touch-action:manipulation;
  -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
}
.app{height:100%; max-width:480px; margin:0 auto; display:flex; flex-direction:column; min-height:0}
.screen{display:none; flex:1; min-height:0; flex-direction:column; gap:12px}
.screen.on{display:flex}
.scroll{overflow-y:auto; overflow-x:hidden; padding-bottom:20px; -webkit-overflow-scrolling:touch}
button{font-family:inherit; cursor:pointer; color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--cyan); outline-offset:2px}

.brand{font-size:34px; font-weight:900; letter-spacing:-.02em; line-height:1; text-align:center}
.brand b{color:var(--cyan)}
.tag{text-align:center; color:var(--mute); font-size:14px; margin-top:6px}
.stage{display:flex; flex-direction:column; align-items:center; gap:8px; background:radial-gradient(circle at 50% 40%, #0d3a85 0%, var(--bg2) 62%); border:1px solid var(--line); border-radius:22px; padding:12px 12px 10px}
#prev{width:min(46vw,190px); height:min(46vw,190px); display:block}
.ghost{background:transparent; border:1px solid var(--line); border-radius:999px; padding:7px 16px; font-size:13px; font-weight:700; color:var(--cyan)}
.opts{display:flex; flex-direction:column; gap:10px}
.row{display:grid; grid-template-columns:62px 1fr; align-items:center; gap:10px}
.row>span{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--mute); font-weight:800}
.chips{display:flex; flex-wrap:wrap; gap:8px; min-width:0}
.chip{min-height:38px; padding:0 14px; border-radius:12px; border:1.5px solid var(--line); background:var(--bg2); font-size:14px; font-weight:700; color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--cyan); background:#0d3a85; color:#fff}
.dot{width:38px; height:38px; padding:0; border-radius:50%; border:3px solid transparent}
.dot[aria-pressed="true"]{border-color:#fff}
.chars{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px}
.ch{display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px 5px; border-radius:14px; border:2px solid var(--line); background:var(--bg2); min-width:0}
.ch canvas{width:100%; max-width:64px; aspect-ratio:1; display:block}
.ch span{font-size:11px; font-weight:800; color:var(--mute)}
.ch[aria-checked="true"]{border-color:var(--cyan); background:#0d3a85}
.ch[aria-checked="true"] span{color:#fff}
.namebar{display:flex; gap:10px; align-items:stretch}
#name{flex:1; min-width:0; height:54px; border-radius:16px; border:2px solid var(--line); background:var(--bg2); color:#fff; font:inherit; font-size:18px; font-weight:700; padding:0 16px; user-select:text; -webkit-user-select:text}
#name::placeholder{color:#6f8cc4}
#name.bad{border-color:var(--red); animation:nudge .3s}
@keyframes nudge{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cta{height:54px; padding:0 28px; border:0; border-radius:16px; background:linear-gradient(135deg,var(--cyan),var(--blue)); color:#03153d; font-size:19px; font-weight:900; letter-spacing:.02em}
.cta:active{transform:scale(.97)}
.cta.wide{width:100%}
.sub{background:transparent; border:2px solid var(--line); color:var(--ink); height:48px; border-radius:14px; font-size:15px; font-weight:800; width:100%}

.board{background:var(--bg2); border:1px solid var(--line); border-radius:18px; padding:12px 12px 10px}
.bh{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:6px}
.bh h3{margin:0; font-size:15px; font-weight:900}
.bh small{color:var(--mute); font-size:12px; font-variant-numeric:tabular-nums}
.li{display:grid; grid-template-columns:24px 34px 1fr auto; align-items:center; gap:8px; padding:5px 6px; border-radius:10px; font-size:15px}
.li .rk{font-weight:900; color:var(--mute); text-align:center; font-variant-numeric:tabular-nums}
.li:nth-child(1) .rk{color:var(--amber)}
.li canvas{width:34px; height:34px; display:block}
.li .nm{font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
.li .sc{font-weight:900; font-variant-numeric:tabular-nums; color:var(--cyan)}
.li.me{background:#0d3a85; outline:2px solid var(--cyan)}
.empty{color:var(--mute); font-size:14px; padding:8px 4px}
.prev-win{margin-top:6px; color:var(--mute); font-size:12px}
.foot{text-align:center; color:#6f8cc4; font-size:12px; line-height:1.5}
.sound{background:none; border:0; color:var(--mute); font-size:12px; font-weight:700; text-decoration:underline; padding:6px}

#s-game{padding:0}
#game{flex:1; min-height:0; width:100%; display:block; border-radius:20px; touch-action:none; background:#071a3f}

.res-top{display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center}
.chip-state{font-size:12px; font-weight:900; letter-spacing:.14em; padding:5px 12px; border-radius:999px}
.chip-state.lose{background:rgba(255,107,107,.15); color:var(--red); border:1px solid #8f3b3b}
.chip-state.win{background:rgba(95,212,255,.14); color:var(--cyan); border:1px solid #2f7fd0}
#r-score{font-size:68px; font-weight:900; line-height:1; letter-spacing:-.03em; font-variant-numeric:tabular-nums}
#r-rank{color:var(--mute); font-size:14px}
#r-rob{width:104px; height:104px}
.card{border-radius:18px; padding:16px; border:1px solid var(--line); background:var(--bg2); display:flex; flex-direction:column; gap:8px}
.card.inc{border-color:#8f3b3b; background:linear-gradient(180deg,#2a1224,#1b0f2b)}
.card h2{margin:0; font-size:20px; font-weight:900; line-height:1.15}
.card.inc h2{color:var(--red)}
.card p{margin:0; font-size:15px; line-height:1.5; color:#dbe9ff}
.card .nano{color:var(--cyan); font-weight:800}
.card small{color:#8aa3d6; font-size:12px; line-height:1.4}
.btns{display:grid; gap:10px}
.toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:#0d3a85; border:1px solid var(--cyan); padding:10px 16px; border-radius:12px; font-weight:800; font-size:14px; z-index:20}
.toast[hidden]{display:none!important}
</style>

<div class="app">
  <!-- START -->
  <section id="s-start" class="screen on scroll">
    <div>
      <div class="brand" id="brand">Dust <b>Rush</b></div>
      <div class="tag">Suck the dust. Don't tear the filter.</div>
    </div>
    <div class="stage">
      <canvas id="prev" width="380" height="380" aria-label="Your robot"></canvas>
      <button id="rnd" class="ghost" type="button">Shuffle look</button>
    </div>
    <div id="o-grid" class="chars" role="radiogroup" aria-label="Choose your robot"></div>
    <div class="namebar">
      <input id="name" maxlength="12" placeholder="Your name" autocomplete="off" autocapitalize="words" enterkeyhint="go" aria-label="Your name">
      <button id="play" class="cta" type="button">Play</button>
    </div>
    <div class="board">
      <div class="bh"><h3 id="bt1">Top 10</h3><small>Resets in <span id="cd1">--:--:--</span></small></div>
      <div id="b1"></div>
    </div>
    <div class="foot">60 seconds. Catch the dust, dodge the rest.<br>Illustrative simulation of a bag filter.</div>
    <button id="snd" class="sound" type="button">Sound: on</button>
  </section>

  <!-- GAME -->
  <section id="s-game" class="screen"><canvas id="game"></canvas></section>

  <!-- RESULT -->
  <section id="s-end" class="screen scroll">
    <div class="res-top">
      <div id="r-state" class="chip-state lose">PLANT STOPPED</div>
      <canvas id="r-rob" width="208" height="208"></canvas>
      <div id="r-score">0</div>
      <div id="r-rank"></div>
    </div>
    <div id="r-card" class="card inc"></div>
    <div class="btns">
      <button id="again" class="cta wide" type="button">Play again</button>
      <button id="change" class="sub" type="button">Change robot</button>
    </div>
    <div class="board">
      <div class="bh"><h3 id="bt2">Top 10</h3><small>Resets in <span id="cd2">--:--:--</span></small></div>
      <div id="b2"></div>
    </div>
  </section>
</div>
<div id="toast" class="toast" hidden></div>

var IMGS=[],loaded=0,ready=false;
function randCfg(){return {k:Math.floor(Math.random()*SPR.length)}}
var cfg=jget('dr_cfg',null);
if(!cfg||typeof cfg.k!=='number'||cfg.k<0||cfg.k>=SPR.length)cfg=randCfg();

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,Math.PI*2)}

/* drawSprite: r is the robot's body radius; the picture is about 3r wide */
function drawSprite(c,x,y,r,k,st){
  st=st||{};var sp=SPR[k],ims=IMGS[k];if(!sp||!ims)return;
  var pose=st.pose||'n',fb=false;
  if(pose==='t'&&!ims.t){pose='n';fb=true}
  var im=ims[pose],d=pose==='n'?sp:(sp[pose==='w'?'w2':pose]);
  if(!im||!im.complete||!im.naturalWidth)return;
  var sc=r*3.5/200,t=st.t||0;
  c.save();c.translate(x,y);
  if(st.boost){c.fillStyle='rgba(95,212,255,.22)';circ(c,0,0,r*1.7);c.fill()}
  if(fb)c.rotate(Math.sin(t*2)*.07);
  if(st.frozen)c.globalAlpha=.8;
  c.drawImage(im,-d.ax*sc,-d.ay*sc,d.w*sc,d.h*sc);
  c.globalAlpha=1;
  if(st.frozen){c.strokeStyle='rgba(242,193,78,.9)';c.lineWidth=r*.12;circ(c,0,0,r*(1.35+Math.sin(t*10)*.04));c.stroke();
    c.fillStyle='rgba(242,193,78,.85)';[[-.9,-1.0,.16],[.95,-.7,.12],[.2,-1.35,.1]].forEach(function(p){circ(c,p[0]*r,p[1]*r,p[2]*r);c.fill()})}
  if(fb){c.fillStyle='#8fd8ff';c.beginPath();c.moveTo(r*1.0,-r*1.0);c.quadraticCurveTo(r*1.22,-r*.62,r*1.0,-r*.5);c.quadraticCurveTo(r*.78,-r*.62,r*1.0,-r*1.0);c.fill()}
  c.restore();
}
function loadSprites(){
  var total=0;SPR.forEach(function(sp){total+=1+(sp.t?1:0)+1+1});
  function done(){loaded++;if(loaded===total){ready=true;buildOpts();renderBoard($('b1'));if($('s-end').classList.contains('on'))renderBoard($('b2'),lastTs)}}
  function mk(src){var im=new Image();im.onload=done;im.onerror=done;im.src=src;return im}
  SPR.forEach(function(sp,i){IMGS[i]={n:mk(sp.src),t:sp.t?mk(sp.t.src):null,w:mk(sp.w2.src),l:mk(sp.l.src)}});
}

/* ---------- customizer ---------- */
function buildOpts(){
  var g=$('o-grid');g.innerHTML='';
  SPR.forEach(function(sp,i){
    var b=document.createElement('button');b.type='button';b.className='ch';b.setAttribute('role','radio');b.setAttribute('aria-checked',cfg.k===i?'true':'false');b.setAttribute('aria-label',sp.n);
    var cv=document.createElement('canvas');cv.width=128;cv.height=128;
    if(ready)drawSprite(cv.getContext('2d'),64,68,22,i,{});
    var l=document.createElement('span');l.textContent=sp.n;
    b.appendChild(cv);b.appendChild(l);
    b.addEventListener('click',function(){cfg.k=i;saveCfg();initAudio();sfx('tap');var all=g.children;for(var j=0;j<all.length;j++)all[j].setAttribute('aria-checked',j===i?'true':'false')});
    g.appendChild(b);
  });
}
function saveCfg(){sset('dr_cfg',JSON.stringify(cfg))}

var prevOn=true,pt=0;
function prevLoop(ts){
  if(prevOn){
    var cv=$('prev'),c=cv.getContext('2d');c.clearRect(0,0,cv.width,cv.height);
    pt=ts/1000;if(ready)drawSprite(c,cv.width/2,cv.height/2+Math.sin(pt*2.2)*6+10,cv.width*.23,cfg.k,{});
  }

/* ---------- leaderboard (shared via Firebase Realtime Database, 8-hour windows) ---------- */
var DB_URL='https://dust-rush-default-rtdb.firebaseio.com';   /* paste the Firebase Realtime Database URL between the quotes, no trailing slash */
var H8=8*3600*1000,TZ=3*3600*1000;   /* windows start at 00:00, 08:00, 16:00 Riyadh time, the same on every phone */
function winStart(ts){return Math.floor((ts+TZ)/H8)*H8-TZ}
function winEnd(ts){return winStart(ts)+H8}
function allEntries(){var e=jget('dr_board',[]);return Array.isArray(e)?e:[]}
function saveEntry(en){
  var now=Date.now();var list=allEntries().filter(function(x){return x.ws>=winStart(now)-H8*2});
  list.push(en);if(list.length>300)list=list.slice(-300);sset('dr_board',JSON.stringify(list));
}
var remote={},remoteOk=false;
function entriesFor(ws){return (DB_URL&&remoteOk&&remote[ws])?remote[ws]:allEntries().filter(function(e){return e.ws===ws})}
function fetchBoard(cb){
  if(!DB_URL){if(cb)cb();return}
  var ws=winStart(Date.now()),pend=2,okc=0;
  [ws,ws-H8].forEach(function(w){
    fetch(DB_URL+'/scores.json?orderBy=%22ws%22&equalTo='+w).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
      var a=[];if(d&&typeof d==='object')Object.keys(d).forEach(function(k){var e=d[k];if(e&&typeof e.name==='string'&&typeof e.score==='number'&&typeof e.ts==='number')a.push(e)});
      remote[w]=a;okc++}).catch(function(){}).then(function(){if(--pend===0){remoteOk=(okc===2);setLive();if(cb)cb()}});
  });
}
function postEntry(en,cb){
  if(!DB_URL){if(cb)cb();return}
  var body=JSON.stringify({name:en.name,score:en.score,win:!!en.win,k:en.cfg.k,ts:en.ts,ws:en.ws});
  fetch(DB_URL+'/scores.json',{method:'POST',headers:{'Content-Type':'application/json'},body:body,keepalive:true}).catch(function(){}).then(function(){if(cb)cb()});
}
function setLive(){var t=(DB_URL&&remoteOk)?'Top 10 \u00b7 live':'Top 10';var a=$('bt1'),b=$('bt2');if(a)a.textContent=t;if(b)b.textContent=t}
function topFor(ws){
  var best={};
  entriesFor(ws).forEach(function(e){var k=String(e.name).trim().toLowerCase();if(!best[k]||e.score>best[k].score||(e.score===best[k].score&&e.ts<best[k].ts))best[k]=e});
  return Object.keys(best).map(function(k){return best[k]}).sort(function(a,b){return b.score-a.score||a.ts-b.ts});
}
function renderBoard(el,hlTs){
  var now=Date.now(),ws=winStart(now),top=topFor(ws).slice(0,10);
  el.innerHTML='';
  if(!top.length){var d=document.createElement('div');d.className='empty';d.textContent='No scores yet in this 8-hour window. Be the first.';el.appendChild(d)}
  top.forEach(function(e,i){
    var li=document.createElement('div');li.className='li'+(hlTs&&e.ts===hlTs?' me':'');
    var rk=document.createElement('div');rk.className='rk';rk.textContent=i+1;
    var cv=document.createElement('canvas');cv.width=68;cv.height=68;
    var kk=(e.cfg&&typeof e.cfg.k==='number')?e.cfg.k:(typeof e.k==='number'?e.k:0);if(!(kk>=0&&kk<SPR.length))kk=0;
    if(ready)drawSprite(cv.getContext('2d'),34,37,14,kk,{});
    var nm=document.createElement('div');nm.className='nm';nm.textContent=e.name;
    var sc=document.createElement('div');sc.className='sc';sc.textContent=e.score;
    li.appendChild(rk);li.appendChild(cv);li.appendChild(nm);li.appendChild(sc);el.appendChild(li);
  });
  var prev=topFor(ws-H8);
  if(prev.length){var p=document.createElement('div');p.className='prev-win';p.textContent='Previous 8 hours winner: '+prev[0].name+' \u00b7 '+prev[0].score;el.appendChild(p)}
}
function rankOf(ts){var ws=winStart(Date.now());var t=topFor(ws);for(var i=0;i<t.length;i++){if(t[i].ts===ts)return i+1}
  return null}
function fmt(ms){ms=Math.max(0,ms);var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h<10?'0':'')+h+':'+(m<10?'0':'')+m+':'+(x<10?'0':'')+x}
function tick(){
  var left=fmt(winEnd(Date.now())-Date.now());$('cd1').textContent=left;$('cd2').textContent=left;
  if(winStart(Date.now())!==lastWs){lastWs=winStart(Date.now());fetchBoard(function(){renderBoard($('b1'));if($('s-end').classList.contains('on'))renderBoard($('b2'),lastTs)})}
}
var lastWs=winStart(Date.now()),lastTs=0;

/* ---------- sound ---------- */
var AC=null,soundOn=sget('dr_snd')!=='off';
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}}
function beep(f,d,type,v,f2){
  if(!AC||!soundOn)return;
  try{var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(v||.07,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}
}
function sfx(n,a){
  if(n==='eat')beep(420+Math.min(a||0,30)*22,.06,'triangle',.05);
  else if(n==='heavy'){beep(120,.35,'sawtooth',.09,60)}
  else if(n==='red'){beep(300,.4,'sawtooth',.1,70);beep(90,.35,'square',.06)}
  else if(n==='blue'){beep(520,.1,'triangle',.08);setTimeout(function(){beep(780,.1,'triangle',.08)},80);setTimeout(function(){beep(1040,.16,'triangle',.08)},160)}
  else if(n==='nano'){beep(200,.5,'sine',.09,1200)}
  else if(n==='lose'){beep(400,.25,'square',.08,200);setTimeout(function(){beep(220,.5,'square',.08,90)},220)}
  else if(n==='win'){[523,659,784,1046].forEach(function(f,i){setTimeout(function(){beep(f,.16,'triangle',.09)},i*110)})}
  else if(n==='tap')beep(600,.05,'triangle',.05);
}
function vib(ms){try{if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}}
function setSndLabel(){$('snd').textContent='Sound: '+(soundOn?'on':'off')}

/* ---------- screens ---------- */
function show(id){
  ['s-start','s-game','s-end'].forEach(function(s){$(s).classList.toggle('on',s===id)});
  prevOn=(id==='s-start');
  if(id==='s-start'){renderBoard($('b1'))}
}
var toastT=0;
function toast(t){var e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){e.hidden=true},2200)}

/* ---------- game ---------- */
var G=null,cv=null,cx=null,W=0,H=0,S=1,DPR=1;
var PH2=15,PH3=25,TOTAL=60;
var playerName='';

function sizeGame(){
  cv=$('game');var r=cv.getBoundingClientRect();DPR=Math.min(window.devicePixelRatio||1,2.5);
  W=Math.max(200,r.width);H=Math.max(300,r.height);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cx=cv.getContext('2d');cx.setTransform(DPR,0,0,DPR,0,0);
  S=Math.max(.8,Math.min(W/360,H/640));
}
function rnd(a,b){return a+Math.random()*(b-a)}
function spawn(type){
  var it={x:rnd(18*S,W-18*S),y:-14*S,vx:rnd(-10,10)*S,vy:rnd(.85,1.3)*(165+G.t*2.1)*S,type:type,ph:Math.random()*6.28};
  it.r=(type==='dust'?rnd(3.5,7):type==='heavy'?rnd(6.5,8.5):7.5)*S;
  it.shade=Math.floor(rnd(150,205));
  G.items.push(it);
}
function count(t){var n=0;for(var i=0;i<G.items.length;i++)if(G.items[i].type===t)n++;return n}
function startGame(){
  initAudio();show('s-game');sizeGame();
  var dustN=Math.round(W*H/(360*640)*62);
  G={t:0,score:0,hearts:3,combo:0,comboT:0,sucked:0,clogs:0,speedMul:1,boostT:0,freezeT:0,invT:0,phase:1,nano:false,flash:0,shake:0,
     rob:{x:W/2,y:H*.72,tx:W/2,ty:H*.72,r:20*S},items:[],parts:[],fl:[],banner:{t:0,a:'',b:''},ended:false,last:performance.now(),dustN:dustN,blueCd:3,hit:0,spT:.4};
  banner('Catch the falling dust',2.8,'Drag your finger to move');
  G.raf=requestAnimationFrame(function(t){G.last=t;frame(t)});
}
function banner(a,t,b){G.banner={t:t,max:t,a:a,b:b||''}}
function frame(now){
  if(!G||G.ended)return;
  var dt=Math.min(.05,(now-G.last)/1000);G.last=now;
  update(dt);draw();
  if(!G.ended)G.raf=requestAnimationFrame(frame);
}
function addFloat(x,y,text,col){G.fl.push({x:x,y:y,t:0,text:text,col:col})}
function burst(x,y,col,n,sp){for(var i=0;i<n;i++){var a=Math.random()*6.28,v=rnd(.3,1)*sp*S;G.parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:rnd(.35,.7),col:col,r:rnd(1.5,3.2)*S})}}

function update(dt){
  var g=G,rob=g.rob;g.t+=dt;var t=g.t;
  var ph=t<PH2?1:t<PH3?2:3;
  if(ph!==g.phase){
    g.phase=ph;
    if(ph===2)banner('Why is the robot slowing down?',3.2,'The filter is clogging');
    if(ph===3){g.nano=true;g.flash=1;g.speedMul=1;banner('NanoSense ON',3.4,'Amber = clog   Red = tear   Blue = boost');sfx('nano');vib(60)}
  }
  g.speedMul=ph===2?1-.5*((t-PH2)/(PH3-PH2)):1;
  if(g.freezeT>0)g.freezeT-=dt;
  if(g.boostT>0)g.boostT-=dt;
  if(g.invT>0)g.invT-=dt;
  if(g.comboT>0){g.comboT-=dt;if(g.comboT<=0)g.combo=0}
  if(g.shake>0)g.shake=Math.max(0,g.shake-dt*40);
  if(g.flash>0)g.flash=Math.max(0,g.flash-dt*.8);
  if(g.banner.t>0)g.banner.t-=dt;
  // robot size
  rob.r=S*(20+Math.min(16,g.sucked*.06));
  // move
  var frozen=g.freezeT>0;
  var vmax=340*S*g.speedMul*(g.boostT>0?1.65:1);
  if(!frozen){
    var dx=rob.tx-rob.x,dy=rob.ty-rob.y,d=Math.hypot(dx,dy);
    if(d>1){var sp=Math.min(vmax,d*10);rob.x+=dx/d*sp*dt;rob.y+=dy/d*sp*dt}
  }
  rob.x=Math.max(rob.r,Math.min(W-rob.r,rob.x));rob.y=Math.max(H*.5,Math.min(H-rob.r-34*S,rob.y));
  // everything falls from the top at the same time
  g.spT-=dt;
  while(g.spT<=0){
    g.spT+=Math.max(.09,.2-g.t*.0016);
    var rv=Math.random(),ty='dust';
    if(ph===2){if(rv<.16)ty='heavy'}
    else if(ph===3){if(rv<.12)ty='heavy';else if(rv<.26)ty='red';else if(rv<.31)ty='blue'}
    spawn(ty);
  }
  // items
  var suck=rob.r*1.8,eat=rob.r*.95;
  for(var k=g.items.length-1;k>=0;k--){
    var it=g.items[k];
    it.x+=it.vx*dt;it.y+=it.vy*dt;
    if(it.x<it.r||it.x>W-it.r)it.vx*=-1;
    if(it.y>H+it.r*2){g.items.splice(k,1);continue}
    var ddx=rob.x-it.x,ddy=rob.y-it.y,dist=Math.hypot(ddx,ddy);
    if(it.type==='dust'){
      if(dist<suck+it.r&&!frozen){var pull=(1-dist/(suck+it.r));var sp2=(60+260*pull)*S*dt;it.x+=ddx/(dist||1)*sp2;it.y+=ddy/(dist||1)*sp2;dist=Math.hypot(rob.x-it.x,rob.y-it.y)}
      if(dist<eat+it.r*.4&&!frozen){
        g.items.splice(k,1);g.sucked++;g.combo++;g.comboT=1.2;
        var mult=1+Math.min(4,Math.floor(g.combo/8));g.score+=10*mult;
        burst(it.x,it.y,'#bcd2ff',2,60);sfx('eat',g.combo);
        if(g.combo>0&&g.combo%8===0){addFloat(rob.x,rob.y-rob.r*1.6,'x'+(1+Math.min(4,g.combo/8)),'#5fd4ff')}
      }
    }else{
      var hr=rob.r*.8+it.r;
      if(dist<hr){
        g.items.splice(k,1);
        if(it.type==='heavy'){
          g.freezeT=2;g.clogs++;g.combo=0;g.shake=8;burst(rob.x,rob.y,'#f2c14e',14,120);addFloat(rob.x,rob.y-rob.r*1.7,'CLOG!','#f2c14e');sfx('heavy');vib(80);
        }else if(it.type==='red'){
          if(g.invT<=0){
            g.hearts--;g.score=Math.floor(g.score*.85);g.combo=0;g.invT=1.1;g.shake=18;g.hit=.25;
            burst(rob.x,rob.y,'#ff6b6b',22,160);addFloat(rob.x,rob.y-rob.r*1.7,'TEAR  -15%','#ff6b6b');sfx('red');vib([60,40,90]);
            if(g.hearts<=0){endGame(false);return}
          }
        }else if(it.type==='blue'){
          g.boostT=4;g.score+=25;burst(rob.x,rob.y,'#5fd4ff',18,140);addFloat(rob.x,rob.y-rob.r*1.7,'BOOST!','#5fd4ff');sfx('blue');vib(30);
        }
      }
    }
  }
  if(g.hit>0)g.hit-=dt;
  for(var p=g.parts.length-1;p>=0;p--){var q=g.parts[p];q.t+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.96;q.vy*=.96;if(q.t>q.life)g.parts.splice(p,1)}
  for(var f=g.fl.length-1;f>=0;f--){var fl=g.fl[f];fl.t+=dt;if(fl.t>1)g.fl.splice(f,1)}
  if(t>=TOTAL){g.score+=300;endGame(true)}
}

function heart(c,x,y,s,fill){
  c.beginPath();c.moveTo(x,y+s*.35);c.bezierCurveTo(x-s*.7,y-s*.25,x-s*.45,y-s*.8,x,y-s*.35);c.bezierCurveTo(x+s*.45,y-s*.8,x+s*.7,y-s*.25,x,y+s*.35);
  c.closePath();c.fillStyle=fill?'#ff5a7a':'rgba(255,255,255,.12)';c.fill();
}
function star(c,x,y,r,n,t){
  c.beginPath();for(var i=0;i<n*2;i++){var a=i*Math.PI/n+t,rad=i%2?r*.5:r;c.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad)}c.closePath();
}
function draw(){
  var g=G,c=cx,rob=g.rob,t=g.t;
  c.save();
  var sx=g.shake?rnd(-g.shake,g.shake)*.5:0,sy=g.shake?rnd(-g.shake,g.shake)*.5:0;
  c.translate(sx,sy);
  // floor
  var bg=c.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0a2250');bg.addColorStop(1,'#061633');
  c.fillStyle=bg;c.fillRect(-20,-20,W+40,H+40);
  // hanging filter bags along the top
  var nb=Math.max(4,Math.round(W/62));var bw=W/nb;
  for(var b=0;b<nb;b++){c.fillStyle='rgba(120,160,230,.10)';rr(c,b*bw+bw*.14,-10,bw*.72,46*S,bw*.22);c.fill()}
  // floor lines
  c.strokeStyle='rgba(95,160,255,.06)';c.lineWidth=1;
  for(var gx=0;gx<=W;gx+=44*S){c.beginPath();c.moveTo(gx,0);c.lineTo(gx,H);c.stroke()}
  for(var gy=60*S;gy<=H;gy+=44*S){c.beginPath();c.moveTo(0,gy);c.lineTo(W,gy);c.stroke()}
  // suction ring
  if(g.freezeT<=0){c.strokeStyle='rgba(95,212,255,.22)';c.lineWidth=2;c.setLineDash([6,8]);c.lineDashOffset=-t*30;circ(c,rob.x,rob.y,rob.r*1.95);c.stroke();c.setLineDash([])}
  // items
  for(var i=0;i<g.items.length;i++){
    var it=g.items[i],hid=!g.nano;
    if(it.type==='dust'||(it.type==='heavy'&&hid)){
      var sh=it.shade;c.fillStyle='rgb('+sh+','+(sh+8)+','+(sh+22)+')';circ(c,it.x,it.y,it.r);c.fill();
    }else if(it.type==='heavy'){
      var pu=1+Math.sin(t*6+it.ph)*.12;
      c.fillStyle='rgba(242,193,78,.2)';circ(c,it.x,it.y,it.r*2*pu);c.fill();
      c.fillStyle='#f2c14e';circ(c,it.x,it.y,it.r*1.15);c.fill();
      c.fillStyle='#7a5a0b';circ(c,it.x,it.y,it.r*.5);c.fill();
    }else if(it.type==='red'){
      var pu2=1+Math.sin(t*9+it.ph)*.15;
      c.fillStyle='rgba(255,107,107,.22)';circ(c,it.x,it.y,it.r*2.3*pu2);c.fill();
      c.fillStyle='#ff6b6b';star(c,it.x,it.y,it.r*1.7,6,t*2+it.ph);c.fill();
      c.fillStyle='#fff1f1';circ(c,it.x,it.y,it.r*.35);c.fill();
    }else if(it.type==='blue'){
      var pu3=1+Math.sin(t*7+it.ph)*.15;
      c.fillStyle='rgba(95,212,255,.25)';circ(c,it.x,it.y,it.r*2.4*pu3);c.fill();
      c.fillStyle='#5fd4ff';circ(c,it.x,it.y,it.r*1.15);c.fill();
      c.fillStyle='#ffffff';circ(c,it.x,it.y,it.r*.45);c.fill();
    }
  }
  // particles
  for(var p=0;p<g.parts.length;p++){var q=g.parts[p];c.globalAlpha=Math.max(0,1-q.t/q.life);c.fillStyle=q.col;circ(c,q.x,q.y,q.r);c.fill()}
  c.globalAlpha=1;
  // robot
  var blink=g.invT>0&&Math.floor(t*14)%2===0;
  if(!blink){
    drawSprite(c,rob.x,rob.y+Math.sin(t*5)*1.5*S,rob.r,cfg.k,{t:t,pose:(g.freezeT>0||g.phase===2)?'t':'n',frozen:g.freezeT>0,boost:g.boostT>0});
  }
  // floaters
  for(var f=0;f<g.fl.length;f++){var fl=g.fl[f];c.globalAlpha=Math.max(0,1-fl.t);c.fillStyle=fl.col;c.font='900 '+(20*S)+'px '+getComputedStyle(document.body).fontFamily;c.textAlign='center';c.fillText(fl.text,fl.x,fl.y-fl.t*50*S)}
  c.globalAlpha=1;
  c.restore();
  // tired overlay: haze + vignette
  if(g.phase===2){
    var k=Math.min(1,(t-PH2)/(PH3-PH2));
    var vg=c.createRadialGradient(W/2,H/2,Math.min(W,H)*.2,W/2,H/2,Math.max(W,H)*.75);
    vg.addColorStop(0,'rgba(20,24,40,0)');vg.addColorStop(1,'rgba(20,24,40,'+(.35+.4*k)+')');
    c.fillStyle=vg;c.fillRect(0,0,W,H);
    c.fillStyle='rgba(160,170,190,'+(.06+.12*k)+')';c.fillRect(0,0,W,H);
  }
  // red hit flash
  if(g.hit>0){c.fillStyle='rgba(255,60,80,'+(g.hit*1.2)+')';c.fillRect(0,0,W,H)}
  // nano flash
  if(g.flash>0){c.fillStyle='rgba(120,220,255,'+(g.flash*.55)+')';c.fillRect(0,0,W,H)}
  hud(c);
}
function hud(c){
  var g=G,font=getComputedStyle(document.body).fontFamily;
  // top bar backing
  c.fillStyle='rgba(5,15,43,.62)';c.fillRect(0,0,W,50*S);
  c.textAlign='left';c.fillStyle='#9bb6e6';c.font='800 '+(10*S)+'px '+font;c.fillText('SCORE',14*S,17*S);
  c.fillStyle='#fff';c.font='900 '+(26*S)+'px '+font;c.fillText(String(g.score),14*S,42*S);
  // hearts
  for(var i=0;i<3;i++)heart(c,W-24*S-i*28*S,26*S,13*S,i<g.hearts);
  // time text
  var left=Math.max(0,Math.ceil(TOTAL-g.t));
  c.textAlign='center';c.fillStyle=left<=10?'#f2c14e':'#e8f3ff';c.font='900 '+(22*S)+'px '+font;c.fillText(String(left),W/2,35*S);
  // time bar
  var frac=Math.max(0,(TOTAL-g.t)/TOTAL);
  c.fillStyle='rgba(255,255,255,.12)';c.fillRect(0,50*S,W,4*S);
  c.fillStyle=left<=10?'#f2c14e':'#5fd4ff';c.fillRect(0,50*S,W*frac,4*S);
  // bottom: filter bar
  var fb=g.freezeT>0?.12:(g.phase===2?1-.75*((g.t-PH2)/(PH3-PH2)):1);
  var bw=Math.min(W*.5,200),bx=14*S,by=H-24*S;
  c.textAlign='left';c.fillStyle='#9bb6e6';c.font='800 '+(10*S)+'px '+font;c.fillText('FILTER',bx,by-8*S);
  c.fillStyle='rgba(255,255,255,.14)';rr(c,bx,by-4*S,bw,9*S,4.5*S);c.fill();
  c.fillStyle=fb<.35?'#f2c14e':'#5fd4ff';rr(c,bx,by-4*S,Math.max(8*S,bw*fb),9*S,4.5*S);c.fill();
  // combo
  if(g.combo>=8){var m=1+Math.min(4,Math.floor(g.combo/8));c.textAlign='right';c.fillStyle='#5fd4ff';c.font='900 '+(26*S)+'px '+font;c.fillText('x'+m,W-16*S,H-18*S)}
  if(g.boostT>0){c.textAlign='right';c.fillStyle='#5fd4ff';c.font='800 '+(11*S)+'px '+font;c.fillText('BOOST',W-16*S,H-48*S)}
  // banner
  if(g.banner.t>0){
    var a=Math.min(1,g.banner.t/.4,(g.banner.max-g.banner.t)/.2+.2);
    c.globalAlpha=Math.max(0,Math.min(1,a));c.textAlign='center';
    c.fillStyle='rgba(5,15,43,.72)';rr(c,W*.07,H*.26,W*.86,(g.banner.b?72:50)*S,16*S);c.fill();
    c.fillStyle='#fff';c.font='900 '+(21*S)+'px '+font;c.fillText(g.banner.a,W/2,H*.26+32*S);
    if(g.banner.b){c.fillStyle='#9bd9ff';c.font='700 '+(13*S)+'px '+font;c.fillText(g.banner.b,W/2,H*.26+56*S)}
    c.globalAlpha=1;
  }
}

/* pointer control */
function ptr(e){
  if(!G||G.ended)return;var r=cv.getBoundingClientRect();
  G.rob.tx=(e.clientX-r.left)*(W/r.width);G.rob.ty=(e.clientY-r.top)*(H/r.height)-(e.pointerType==='touch'?26*S:0);
}
function bindGame(){
  var c=$('game');
  c.addEventListener('pointerdown',function(e){try{c.setPointerCapture(e.pointerId)}catch(x){}ptr(e);e.preventDefault()});
  c.addEventListener('pointermove',function(e){ptr(e)});
  c.addEventListener('contextmenu',function(e){e.preventDefault()});
}

/* ---------- end of run ---------- */
var INC=[
  {t:'FILTER RUPTURE',p:'A filter bag tore and nobody knew which one. Fine dust escaped into the air the workers breathe, and the plant had to stop.'},
  {t:'UNSEEN TEAR',p:'One torn bag went unnoticed for hours. Dust built up where it should not, and some fine industrial dusts can ignite. The plant stopped to inspect every bag.'}
];
function endGame(win){
  var g=G;if(!g||g.ended)return;g.ended=true;cancelAnimationFrame(g.raf);
  var ts=Date.now();lastTs=ts;
  var en={name:playerName,score:g.score,win:!!win,cfg:{k:cfg.k},ts:ts,ws:winStart(ts)};
  saveEntry(en);
  postEntry(en,function(){fetchBoard(function(){var rk2=rankOf(ts);$('r-rank').textContent=rk2?('#'+rk2+' on this 8-hour board'):'';renderBoard($('b2'),ts)})});
  sfx(win?'win':'lose');vib(win?[40,40,40]:200);
  // result screen
  var st=$('r-state');st.className='chip-state '+(win?'win':'lose');st.textContent=win?'PLANT SAVED':'PLANT STOPPED';
  $('r-score').textContent=g.score;
  var rk=rankOf(ts);$('r-rank').textContent=rk?('#'+rk+' on this 8-hour board'):'';
  var card=$('r-card');card.innerHTML='';
  var h=document.createElement('h2'),p=document.createElement('p'),n=document.createElement('p'),s=document.createElement('small');
  if(win){
    card.className='card';h.textContent='You kept the plant running';
    p.textContent='You saw the clogs and the tears in time. That is the idea: see the problem before the filter fails.';
    n.className='nano';n.textContent='NanoSense is designed to show it for real.';
  }else{
    card.className='card inc';var inc=INC[Math.floor(Math.random()*INC.length)];
    h.textContent=inc.t;p.textContent=inc.p;
    n.className='nano';n.textContent='NanoSense is designed to point to the exact compartment.';
  }
  s.textContent='Illustrative simulation. Our lab prototype classifies real filter signals.';
  card.appendChild(h);card.appendChild(p);card.appendChild(n);card.appendChild(s);
  var rc=$('r-rob'),c2=rc.getContext('2d');c2.clearRect(0,0,rc.width,rc.height);
  drawSprite(c2,rc.width/2,rc.height/2+8,rc.width*.24,cfg.k,{pose:win?'w':'l'});
  renderBoard($('b2'),ts);
  show('s-end');$('s-end').scrollTop=0;
}

/* ---------- wiring ---------- */
function begin(){
  var nm=$('name').value.replace(/[\u0000-\u001f<>]/g,'').trim().slice(0,12);
  if(!nm){var inp=$('name');inp.classList.remove('bad');void inp.offsetWidth;inp.classList.add('bad');inp.placeholder='Type your name first';inp.focus();return}
  playerName=nm;sset('dr_name',nm);initAudio();sfx('tap');startGame();
}
$('play').addEventListener('click',begin);
$('name').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();$('name').blur();begin()}});
$('rnd').addEventListener('click',function(){cfg=randCfg();buildOpts();saveCfg();initAudio();sfx('tap')});
$('again').addEventListener('click',function(){startGame()});
$('change').addEventListener('click',function(){show('s-start')});
$('snd').addEventListener('click',function(){soundOn=!soundOn;sset('dr_snd',soundOn?'on':'off');setSndLabel();initAudio();sfx('tap')});
var bt=0,btT=0;
$('brand').addEventListener('click',function(){var n=Date.now();if(n-btT>4000)bt=0;btT=n;bt++;if(bt>=7){bt=0;sset('dr_board','[]');renderBoard($('b1'));toast('Scores cleared on this device')}});
window.addEventListener('resize',function(){if(G&&!G.ended){sizeGame()}});

$('name').value=sget('dr_name')||'';
loadSprites();buildOpts();setSndLabel();bindGame();renderBoard($('b1'));tick();setInterval(tick,1000);
fetchBoard(function(){renderBoard($('b1'))});
setInterval(function(){if(document.hidden||$('s-game').classList.contains('on'))return;fetchBoard(function(){if($('s-start').classList.contains('on'))renderBoard($('b1'));else if($('s-end').classList.contains('on'))renderBoard($('b2'),lastTs)})},15000);
requestAnimationFrame(prevLoop);
})();
</script>
